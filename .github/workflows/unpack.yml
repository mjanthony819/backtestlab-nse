name: unpack
on: push
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - run: |
          test -f 1-bundle.zip
          unzip -oq 1-bundle.zip
          rm 1-bundle.zip
          git config user.name "M J Anthony"
          git config user.email "mjanthony819@users.noreply.github.com"
          git add -A
          git commit -m "Add BacktestLab NSE project"
          git push
